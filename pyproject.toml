[project]
name = "openwebui-pyodide-file-persistence"
version = "0.2.0a3"
description = "Shared browser Python and Bash workspaces with durable files for Open WebUI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic==2.13.4", "sqlalchemy==2.0.50"]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1", "basedpyright==1.38.3", "pytest==9.0.2", "ruff==0.15.7",
  "psycopg[binary]==3.3.3; python_version < '3.15'",
  "psycopg==3.3.3; python_version >= '3.15'",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "scripts", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: real database and provider-boundary contracts"]
