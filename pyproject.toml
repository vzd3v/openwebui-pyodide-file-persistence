[project]
name = "openwebui-pyodide-file-saver"
version = "0.1.0a1"
description = "Durable browser Python workspaces and shared-chat file links for Open WebUI"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["pydantic==2.13.4", "sqlalchemy==2.0.50"]

[dependency-groups]
dev = ["aiosqlite==0.22.1", "basedpyright==1.38.3", "pytest==9.0.2", "ruff==0.15.7", "psycopg[binary]==3.3.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "scripts", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: real database and provider-boundary contracts"]
